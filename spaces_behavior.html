<!DOCTYPE html>
<html>
<head>
<script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
<style>
  .mon{position:relative;width:440px;height:200px;border:3px solid #555;border-radius:4px;overflow:hidden;background:#3a6ea5}
  .menubar{position:absolute;top:0;left:0;right:0;height:10px;background:#e6e6e6;z-index:30}
  .strip{position:absolute;top:10px;left:0;width:880px;height:164px;display:flex;transition:transform .45s ease}
  .desk{width:440px;height:164px;position:relative;flex:none}
  .desk:nth-child(2){background:#2f7a6a}
  .dlabel{position:absolute;left:6px;bottom:4px;color:#fff;font-size:12px;opacity:.85}
  .tb{position:absolute;left:0;right:0;bottom:0;height:26px;box-sizing:border-box;background:#c0c0c0;border-top:2px solid #fff;z-index:20;display:flex;align-items:center;gap:3px;padding:0 3px;color:#000}
  .btn{height:20px;box-sizing:border-box;display:flex;align-items:center;gap:4px;padding:0 6px;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;white-space:nowrap;font-size:12px;cursor:pointer;flex:0 1 82px;min-width:0;overflow:hidden}
  .btn span.l{overflow:hidden;text-overflow:ellipsis}
  .btn.start{flex:none;font-weight:700}
  .btn.pressed{border-color:#404040 #fff #fff #404040;background:#dcdcdc}
  .btn.other{opacity:.55;border-style:dashed;border-color:#555}
  .ico{width:12px;height:12px;display:inline-block;flex:none}
  .win{position:absolute;background:#fff;border:2px solid #c0c0c0;outline:1px solid #000;display:flex;flex-direction:column;cursor:pointer}
  .title{height:16px;color:#fff;font-size:12px;line-height:16px;padding-left:4px;background:#808080}
  .win.focused .title{background:#000080}
  .body{flex:1;background:repeating-linear-gradient(#fff 0 9px,#eee 9px 10px)}
  .toast{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:4px 10px;border-radius:4px;z-index:40;display:none}
  .seg button.active{background:var(--primary);color:var(--primary-foreground)}
</style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-4">
<div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shadow-sm">
  <h2 class="font-semibold text-base">Q4: Which windows should a display's taskbar show?</h2>
  <p class="text-xs text-[var(--muted-foreground)] mt-1">Try: switch desktops, click a taskbar button, click the focused one again (minimizes), click the minimized “Preview”, click Start.</p>

  <div class="flex gap-4 mt-3 flex-wrap items-center text-sm">
    <div class="flex items-center gap-2"><span class="text-[var(--muted-foreground)]">Taskbar shows:</span>
      <div class="seg flex border border-[var(--border)] rounded-md overflow-hidden" id="modeSeg">
        <button data-v="current" class="px-3 py-1">Current Space only</button>
        <button data-v="all" class="px-3 py-1 border-l border-[var(--border)]">All Spaces</button>
      </div></div>
    <div class="flex items-center gap-2"><span class="text-[var(--muted-foreground)]">Desktop:</span>
      <div class="seg flex border border-[var(--border)] rounded-md overflow-hidden" id="spaceSeg">
        <button data-v="1" class="px-3 py-1">1</button>
        <button data-v="2" class="px-3 py-1 border-l border-[var(--border)]">2</button>
      </div></div>
  </div>

  <div class="mon mt-3">
    <div class="menubar"></div>
    <div class="strip" id="strip">
      <div class="desk" id="desk1"><span class="dlabel">Desktop 1</span></div>
      <div class="desk" id="desk2"><span class="dlabel">Desktop 2</span></div>
    </div>
    <div class="tb" id="tb"></div>
    <div class="toast" id="toast"></div>
  </div>

  <p id="desc" class="text-sm mt-3 text-[var(--muted-foreground)] leading-relaxed"></p>
</div>

<script>
const wins=[
  {id:'safari',name:'Safari',space:1,x:20,y:12,w:190,h:100,c:'#1e90ff'},
  {id:'notes',name:'Notes',space:1,x:225,y:30,w:170,h:95,c:'#f4c430'},
  {id:'term',name:'Terminal',space:2,x:30,y:18,w:200,h:105,c:'#222'},
  {id:'mail',name:'Mail',space:2,x:250,y:28,w:160,h:90,c:'#3b82f6'},
  {id:'prev',name:'Preview',space:1,x:120,y:40,w:160,h:90,c:'#7c3aed',min:true}
];
let mode='current', cur=1, focused='safari', z=['notes','safari'];
const desc={
  current:"<b>Current Space only</b> (also the default for Windows virtual desktops). Each display's bar lists windows on <i>that display's</i> current Space, plus minimized windows. Switch desktops and the bar updates. <b>Needs only public macOS APIs</b>, because Accessibility already reports only current-Space windows. Simplest and lightest.",
  all:"<b>All Spaces.</b> Windows from every Space are listed. Ones on another Space are dimmed with a dashed outline, and clicking one makes macOS slide to that Space and focus it. <b>Needs private window-server APIs</b> (the AltTab approach) to find and focus windows on other Spaces: more code, more background work, and it can break when macOS updates."
};
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1400);}

function renderWins(){
  $('desk1').querySelectorAll('.win').forEach(e=>e.remove());
  $('desk2').querySelectorAll('.win').forEach(e=>e.remove());
  wins.filter(w=>!w.min).forEach(w=>{
    const e=document.createElement('div');
    e.className='win'+(w.id===focused?' focused':'');
    Object.assign(e.style,{left:w.x+'px',top:w.y+'px',width:w.w+'px',height:w.h+'px',zIndex:10+z.indexOf(w.id)});
    e.innerHTML=`<div class="title">${w.name}</div><div class="body"></div>`;
    e.onclick=()=>focus(w);
    $('desk'+w.space).appendChild(e);
  });
}
function renderBar(){
  const tb=$('tb'); tb.innerHTML='';
  const s=document.createElement('div');s.className='btn start';
  s.innerHTML='<span class="ico" style="background:linear-gradient(135deg,#e33 50%,#3a3 50%)"></span>Start';
  s.onclick=()=>toast('→ opens Launchpad');tb.appendChild(s);
  wins.filter(w=>mode==='all'||w.min||w.space===cur).forEach(w=>{
    const b=document.createElement('div');
    const other=!w.min&&w.space!==cur;
    b.className='btn'+(w.id===focused&&!w.min&&!other?' pressed':'')+(other?' other':'');
    b.title=w.min?'Minimized':other?`On Desktop ${w.space}`:'';
    b.innerHTML=`<span class="ico" style="background:${w.c}"></span><span class="l">${w.min?'':''}${w.name}${other?' ·D'+w.space:''}</span>`;
    b.onclick=()=>clickBtn(w);
    tb.appendChild(b);
  });
}
function render(){
  $('strip').style.transform=`translateX(${cur===1?0:-440}px)`;
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('active',b.dataset.v===mode));
  document.querySelectorAll('#spaceSeg button').forEach(b=>b.classList.toggle('active',+b.dataset.v===cur));
  $('desc').innerHTML=desc[mode];
  renderWins();renderBar();
}
function topOf(space){const vis=z.filter(id=>{const w=wins.find(x=>x.id===id);return !w.min&&w.space===space;});return vis[vis.length-1]||null;}
function focus(w){focused=w.id;z=z.filter(i=>i!==w.id);z.push(w.id);render();}
function switchSpace(s){cur=s;focused=topOf(s);render();}
function clickBtn(w){
  if(w.min){w.min=false;w.space=cur;focus(w);toast('Restored');return;}
  if(w.space!==cur){cur=w.space;focus(w);toast(`macOS switches to Desktop ${w.space}`);return;}
  if(focused===w.id){w.min=true;focused=topOf(cur);render();toast('Minimized (click again to restore)');return;}
  focus(w);
}
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{mode=b.dataset.v;render();});
document.querySelectorAll('#spaceSeg button').forEach(b=>b.onclick=()=>switchSpace(+b.dataset.v));
render();
</script>
</body>
</html>
