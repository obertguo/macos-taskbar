<!DOCTYPE html>
<html>
<head>
<script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
<style>
  .scr{position:relative;width:270px;height:170px;background:#3a6ea5;overflow:hidden;border:3px solid #555;border-radius:4px}
  .menubar{position:absolute;top:0;left:0;right:0;height:10px;background:#e6e6e6;z-index:30}
  .tb{position:absolute;left:0;right:0;bottom:0;height:26px;box-sizing:border-box;background:#c0c0c0;border-top:2px solid #fff;z-index:20;display:flex;align-items:center;gap:3px;padding:0 3px;font-size:12px;color:#000;transition:opacity .3s}
  .btn{height:20px;box-sizing:border-box;display:flex;align-items:center;gap:4px;padding:0 6px;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;white-space:nowrap;font-size:12px}
  .btn.pressed{border-color:#404040 #fff #fff #404040;background:#dcdcdc}
  .ico{width:12px;height:12px;display:inline-block}
  .win{position:absolute;z-index:10;background:#fff;border:2px solid #c0c0c0;outline:1px solid #000;transition:all .35s ease;display:flex;flex-direction:column}
  .title{height:16px;background:#000080;color:#fff;font-size:12px;line-height:16px;padding-left:4px;flex:none}
  .body{flex:1;background:repeating-linear-gradient(#fff 0 9px,#eee 9px 10px)}
  .status{height:16px;flex:none;background:#ffd84d;border-top:1px solid #999;font-size:12px;line-height:15px;padding-left:4px;color:#000}
  .dock{position:absolute;left:50%;transform:translateX(-50%);bottom:3px;height:20px;display:none;gap:3px;z-index:15;padding:2px 4px;background:rgba(255,255,255,.5);border-radius:5px}
  .dock i{width:14px;height:14px;border-radius:3px;display:block}
  .tag{position:absolute;z-index:25;font-size:12px;padding:1px 5px;border-radius:3px;color:#fff;display:none;white-space:nowrap}
  .tab.active{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
</style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-4">
<div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shadow-sm">
  <div class="flex items-baseline justify-between flex-wrap gap-2">
    <h2 class="font-semibold text-base">Q2: How should maximized windows interact with the taskbar?</h2>
    <span class="text-xs text-[var(--muted-foreground)]">Yellow strip = window's bottom edge (status bar / input box)</span>
  </div>

  <div class="flex gap-2 mt-3 flex-wrap" id="tabs">
    <button class="tab text-sm px-3 py-1 rounded-md border border-[var(--border)]" data-m="A">A · Overlap</button>
    <button class="tab text-sm px-3 py-1 rounded-md border border-[var(--border)]" data-m="B">B · Dock shim</button>
    <button class="tab text-sm px-3 py-1 rounded-md border border-[var(--border)]" data-m="C">C · AX nudger</button>
    <button class="tab text-sm px-3 py-1 rounded-md border border-[var(--border)]" data-m="BC">B + C</button>
  </div>

  <div class="flex gap-4 mt-3 flex-wrap" id="screens"></div>

  <div class="flex gap-2 mt-3 items-center flex-wrap">
    <button id="max" class="text-sm px-3 py-1 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)]">▢ Maximize windows</button>
    <button id="reset" class="text-sm px-3 py-1 rounded-md border border-[var(--border)]">Reset</button>
    <button id="xray" class="text-sm px-3 py-1 rounded-md border border-[var(--border)]">X-ray: show hidden system Dock</button>
  </div>

  <p id="desc" class="text-sm mt-3 text-[var(--muted-foreground)] leading-relaxed"></p>
</div>

<script>
const W=270,H=170,MB=10,TB=26,BW=2;
const modes={
  A:{s:['overlap','overlap'],d:"<b>Overlap.</b> The bar floats on top. Maximized windows extend <i>underneath</i> it, so their bottom edge (status bars, scrollbars, chat input boxes) is hidden. No extra code. This is what uBar does."},
  B:{s:['reserve','overlap'],d:"<b>Dock shim.</b> The real macOS Dock stays 'visible' but is shrunk to the bar's height and hidden <i>under</i> our bar (try X-ray). macOS then reserves the space itself, so the green button, double-clicking the title bar, and Rectangle all stop at the bar, with no flicker. <b>Catch:</b> the Dock reserves space on only <b>one</b> display (and moves to whichever display you push the mouse against). It also means changing your Dock settings, which we restore on quit."},
  C:{s:['nudge','nudge'],d:"<b>AX nudger.</b> The bar floats. The app watches window move/resize events through the Accessibility API and pushes any window that overlaps the bar back above it. Works on <b>every display</b>, but you see a brief overshoot-then-snap (about 50–150 ms). A few apps resist being resized (fixed-size windows, some Java/Electron apps)."},
  BC:{s:['reserve','nudge'],d:"<b>B + C.</b> The system reserves space on the display that has the Dock, and the nudger handles the others. Best result, most code. The nudger has to treat the Dock's display as already handled."}
};
let mode='A', xray=false, timers=[];

function screenHTML(i){
  return `<div>
    <div class="text-xs text-[var(--muted-foreground)] mb-1">Display ${i+1}${i===0?' (main)':''}</div>
    <div class="scr" id="s${i}">
      <div class="menubar"></div>
      <div class="win" id="w${i}"><div class="title">${i===0?'Notes':'Terminal'}</div><div class="body"></div><div class="status">Status: Ready</div></div>
      <div class="dock" id="d${i}"><i style="background:#e74c3c"></i><i style="background:#2ecc71"></i><i style="background:#3498db"></i><i style="background:#f1c40f"></i></div>
      <div class="tb" id="tb${i}">
        <div class="btn"><span class="ico" style="background:linear-gradient(135deg,#e33 50%,#3a3 50%)"></span><b>Start</b></div>
        <div class="btn pressed"><span class="ico" style="background:${i===0?'#f4c430':'#222'}"></span>${i===0?'Notes':'Terminal'}</div>
      </div>
      <div class="tag" id="warn${i}" style="background:#c0392b;bottom:${TB+3}px;right:4px">⚠ bottom hidden under bar</div>
      <div class="tag" id="nudge${i}" style="background:#16a34a;bottom:${TB+3}px;right:4px">↑ nudged above bar</div>
      <div class="tag" id="ok${i}" style="background:#2563eb;bottom:${TB+3}px;right:4px">✓ space reserved by macOS</div>
    </div></div>`;
}
document.getElementById('screens').innerHTML=screenHTML(0)+screenHTML(1);

const $=id=>document.getElementById(id);
function setWin(i,top,left,w,h){const e=$('w'+i);e.style.top=top+'px';e.style.left=left+'px';e.style.width=w+'px';e.style.height=h+'px';}
function hideTags(i){['warn','nudge','ok'].forEach(t=>$(t+i).style.display='none');}
function clearTimers(){timers.forEach(clearTimeout);timers=[];}

function reset(){
  clearTimers();
  [0,1].forEach(i=>{setWin(i,28,30,150,95);hideTags(i);});
}
function maximize(){
  clearTimers();
  const full=H-MB-BW*2, stop=H-MB-TB-BW*2;
  modes[mode].s.forEach((b,i)=>{
    hideTags(i);
    if(b==='overlap'){setWin(i,MB,0,W-BW*2,full);timers.push(setTimeout(()=>$('warn'+i).style.display='block',380));}
    if(b==='reserve'){setWin(i,MB,0,W-BW*2,stop);timers.push(setTimeout(()=>$('ok'+i).style.display='block',380));}
    if(b==='nudge'){
      setWin(i,MB,0,W-BW*2,full);
      timers.push(setTimeout(()=>{const e=$('w'+i);e.style.transition='all .12s ease';setWin(i,MB,0,W-BW*2,stop);$('nudge'+i).style.display='block';},520));
      timers.push(setTimeout(()=>{$('w'+i).style.transition='';},700));
    }
  });
}
function applyXray(){
  const hasShim=modes[mode].s.map(b=>b==='reserve');
  [0,1].forEach(i=>{
    $('d'+i).style.display=(hasShim[i])?'flex':'none';
    $('tb'+i).style.opacity=(xray&&hasShim[i])?'.3':'1';
  });
  const xb=$('xray');
  const any=hasShim.some(Boolean);
  xb.disabled=!any; xb.style.opacity=any?'1':'.4';
  xb.textContent=xray?'X-ray: on (Dock under bar)':'X-ray: show hidden system Dock';
}
function setMode(m){
  mode=m; xray=false;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.m===m));
  $('desc').innerHTML=modes[m].d;
  reset(); applyXray();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.m));
$('max').onclick=maximize; $('reset').onclick=reset;
$('xray').onclick=()=>{xray=!xray;applyXray();};
setMode('A');
</script>
</body>
</html>
